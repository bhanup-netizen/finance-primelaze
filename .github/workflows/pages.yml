name: Deploy dashboard to GitHub Pages

# Publishes the static dashboard (index.html + assets) to GitHub Pages.
# Enable Pages once under Settings → Pages → Source: "GitHub Actions".

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Assemble public site
        # Publish ONLY the encrypted app. The source workbooks and the
        # plaintext data.json must never reach the public Pages site.
        run: |
          mkdir -p _site/assets/css _site/assets/js _site/docs
          cp index.html _site/
          cp assets/css/styles.css _site/assets/css/
          cp assets/js/app.js _site/assets/js/
          cp assets/js/data.enc.js _site/assets/js/
          cp docs/*.png _site/docs/ 2>/dev/null || true
          echo "Published files:"; find _site -type f

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "_site"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
