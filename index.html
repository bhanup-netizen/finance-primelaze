<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Primelaze Unified Dashboard — FY 2026-27 sales targets, team roster, incentive plans, price book and Esthemax market pricing." />
  <title>Primelaze Unified Dashboard · FY 2026-27</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%234f46e5'/%3E%3Ctext x='50' y='68' font-size='58' font-family='Arial' font-weight='bold' fill='white' text-anchor='middle'%3EP%3C/text%3E%3C/svg%3E" />
  <link rel="stylesheet" href="assets/css/styles.css?v=20260731-21" />
</head>
<body>
  <!-- Login gate: the dashboard data stays AES-256-GCM encrypted until the
       correct password decrypts it in the browser. -->
  <div id="lockScreen" class="lock-screen">
    <form id="lockForm" class="lock-card" autocomplete="on">
      <div class="lock-mark">P</div>
      <h1>Primelaze Dashboard</h1>
      <p class="lock-sub">Sign in with your Primelaze account.</p>
      <label class="lock-field">
        <span>Email</span>
        <input id="lockUser" type="email" autocomplete="username" placeholder="you@primelaze.com" autofocus />
      </label>
      <label class="lock-field">
        <span>Password</span>
        <input id="lockPass" type="password" autocomplete="current-password" placeholder="password" />
      </label>
      <button id="lockBtn" type="submit" class="lock-btn">Sign in</button>
      <button id="forgotLink" type="button" class="lock-forgot">Forgot password?</button>
      <div id="lockError" class="lock-error" role="alert"></div>
    </form>
    <div class="lock-foot">Access is managed by your administrator. Data is encrypted at rest.</div>
  </div>

  <div id="app" hidden>
  <header class="topbar">
    <div class="brand">
      <div class="brand-mark">P</div>
      <div class="brand-text">
        <strong>Primelaze</strong>
        <span>Unified Dashboard</span>
      </div>
    </div>
    <div class="topbar-meta">
      <span class="user-pill" id="userPill" hidden></span>
      <button id="modeToggle" class="mode-btn" title="Switch between view-only and admin (edit) mode" hidden>👁 View</button>
      <button id="pwdBtn" class="mode-btn" title="Change your password" hidden>🔑 Password</button>
      <button id="logoutBtn" class="mode-btn" title="Sign out" hidden>Sign out</button>
      <button id="themeToggle" class="icon-btn" title="Toggle theme" aria-label="Toggle theme">
        <span class="theme-icon">◐</span>
      </button>
    </div>
  </header>

  <nav class="tabs" id="tabs" role="tablist"></nav>

  <main id="view" class="view" aria-live="polite"></main>

  <footer class="footer">
    <span>Primelaze Unified Dashboard</span>
    <span class="dot" id="luDot" hidden>•</span>
    <span id="lastUpdated"></span>
  </footer>
  </div><!-- /#app -->

  <!-- Firebase (compat build — exposes a global `firebase`) -->
  <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script>
  <!-- Firebase Storage — holds uploaded KRA documents for each roster position. -->
  <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-storage-compat.js"></script>
  <!-- SheetJS (xlsx) — parses finance's uploaded Excel/CSV commitment sheets.
       If it can't load, the Payments tab falls back to CSV import/template. -->
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <script src="assets/js/firebase-config.js"></script>
  <script src="assets/js/data.enc.js?v=20260731-12"></script>
  <script src="assets/js/app.js?v=20260731-78"></script>
</body>
</html>
